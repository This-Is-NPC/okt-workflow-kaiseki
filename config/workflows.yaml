- id: 1
  key: kaiseki
  name: Kaiseki Workflow
  buckets:
    - id: 1
      key: requirements
      name: Requirements
      position: 1
      permissions:
        task:
          edit: {allow: true}
          delete: {allow: true}
        comment:
          edit: {allow: true}
          delete: {allow: true}
    - id: 2
      key: planning
      name: Planning
      position: 2
      permissions:
        task:
          edit: {allow: true}
          delete: {allow: true}
        comment:
          edit: {allow: true}
          delete: {allow: false}
    - id: 3
      key: dev
      name: Development
      position: 3
      permissions:
        comment:
          edit: {allow: true}
          delete: {allow: true}
    - {id: 4, key: review, name: Review, position: 4}
    - {id: 5, key: docs, name: Documentation, position: 5}
    - {id: 6, key: done, name: Done, position: 6}
  transitions:
    - from: 1
      to: 2
      guards:
        - type: comments_tagged
          count: 1
          tag: 5w2h
          hint: ${{intl:guard.common.planning.comments_tagged.5w2h.hint}}
        - type: comments_tagged
          count: 1
          tag: requirements
          hint: ${{intl:guard.kaiseki.planning.comments_tagged.requirements.hint}}
        - type: comments_tagged
          count: 1
          tag: acceptance
          hint: ${{intl:guard.common.planning.comments_tagged.acceptance.hint}}
    - from: 2
      to: 3
      guards:
        - type: comments_tagged
          count: 1
          tag: self-branch
          hint: ${{intl:guard.common.dev.comments_tagged.self_branch.hint}}
        - type: comments_tagged
          count: 1
          tag: design
          hint: ${{intl:guard.kaiseki.dev.comments_tagged.design.hint}}
        - type: blockers_in
          buckets: [done, docs]
          hint: ${{intl:guard.common.dev.blockers_in.hint}}
        - {type: wave_gate, hint: '${{intl:guard.wave_gate.hint}}'}
    - from: 3
      to: 4
      guards:
        - type: comments_tagged
          count: 1
          tag: resume
          hint: ${{intl:guard.kaiseki.review.comments_tagged.resume.hint}}
        - type: comments_tagged
          count: 1
          tag: tests-passing
          hint: ${{intl:guard.kaiseki.review.comments_tagged.tests_passing.hint}}
        - {type: subtasks_complete, hint: '${{intl:guard.subtasks_complete.hint}}'}
    - from: 4
      to: 5
      guards:
        - type: comments_tagged
          count: 1
          tag: peer-review
          hint: ${{intl:guard.kaiseki.docs.comments_tagged.peer_review.hint}}
    - from: 5
      to: 6
      guards:
        - type: comments_tagged
          count: 1
          tag: documentation
          hint: ${{intl:guard.common.done.comments_tagged.documentation.hint}}
        - {type: subtasks_complete, hint: '${{intl:guard.subtasks_complete.hint}}'}
    - {from: 4, to: 3}
    - {from: 5, to: 4}
    - {from: 6, to: 4}
    - {from: 6, to: 5}
  operations:
    archive:
      guards:
        - type: comments_tagged
          count: 1
          tag: documentation
          hint: ${{intl:guard.common.archive.comments_tagged.documentation.hint}}
    delete:
      guards:
        - type: comments_tagged
          count: 1
          tag: peer-review
          hint: ${{intl:guard.kaiseki.delete.comments_tagged.peer_review.hint}}
  defaults:
    task:
      edit: {allow: false}
      delete: {allow: false}
    comment:
      edit: {allow: false}
      delete: {allow: false}
